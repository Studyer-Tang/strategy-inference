[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-inference"
version = "0.8.0"
description = "Time-series evaluation, forecast comparison and online uncertainty."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.urls]
Repository = "https://github.com/Studyer-Tang/strategy-inference"
Documentation = "https://studyer-tang.github.io/strategy-inference/library/"
Issues = "https://github.com/Studyer-Tang/strategy-inference/issues"

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
pandas = ["pandas>=2"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "statsmodels>=0.14"]

[project.scripts]
strategy-inference = "strategy_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strategy_inference = ["protocols/*.json", "*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
