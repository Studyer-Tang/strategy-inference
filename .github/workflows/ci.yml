name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[figures,pandas,dev]'
      - run: ruff check .
      - run: python scripts/sync_protocols.py --check
      - run: python scripts/build_site.py --check
      - run: python scripts/build_uncertainty_site.py --check
      - run: python scripts/verify_joint_bounds.py --check
      - run: python scripts/build_joint_site.py --check
      - run: python scripts/build_library_site.py --check
      - run: python -m pytest
      - run: python -m build
      - run: strategy-inference reproduce --study baseline --profile quick --output results/quick
      - run: strategy-inference reproduce --study calibration --profile quick --output results/calibration/quick
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick-figures-py${{ matrix.python-version }}
          path: |
            results/quick
            results/calibration/quick
