name: tests

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[figures,dev]'
      - run: ruff check .
      - run: python -m pytest
      - run: python -m build
      - run: strategy-inference reproduce --profile quick --output results/quick
      - uses: actions/upload-artifact@v4
        with:
          name: quick-figures-py${{ matrix.python-version }}
          path: results/quick
